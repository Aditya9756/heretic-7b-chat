name: 7B Chat Server

# On-demand fast chat session for the Heretic-modified Qwen2.5-7B (Trial 6).
# Start: Actions tab -> Run workflow. Runs up to ~5.5 hours, then stops.
# The public chat link is printed in this job's log (search for CHAT-LINK).
# Append ?key=<CHAT_KEY> to the printed URL (the key is a repo secret and
# is never printed in the log).
on:
  workflow_dispatch:

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download base model (Q4_K_M, 2 parts, ~4.7 GB)
        run: |
          mkdir -p model
          curl -L --fail --retry 2 -o model/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct-GGUF/resolve/main/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf"
          curl -L --fail --retry 2 -o model/qwen2.5-7b-instruct-q4_k_m-00002-of-00002.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct-GGUF/resolve/main/qwen2.5-7b-instruct-q4_k_m-00002-of-00002.gguf"
          ls -la model/
          echo "MODEL-OK"

      - name: Download Trial 6 LoRA adapter (8 parts, from this repo's v1.0 release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0 --pattern "trial6-lora.gguf.part*" --dir model
          cat model/trial6-lora.gguf.part* > model/trial6-lora.gguf
          ls -la model/
          echo "LORA-OK"

      - name: Download llama.cpp server (prebuilt CPU binary)
        run: |
          curl -L --fail --retry 2 -o llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/b12470/llama-b12470-bin-ubuntu-x64.tar.gz"
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          find llama -name "llama-server" -type f
          echo "LLAMA-OK"

      - name: Start server + proxy + tunnel (runs ~5.5 h)
        env:
          CHAT_KEY: ${{ secrets.CHAT_KEY }}
        run: |
          set -e
          SERVER_BIN=$(find llama -name "llama-server" -type f | head -1)
          LIB_DIR=$(dirname "$SERVER_BIN")/../lib
          [ -d "$LIB_DIR" ] && export LD_LIBRARY_PATH="$LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$SERVER_BIN" -m model/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf \
            --lora model/trial6-lora.gguf \
            --host 127.0.0.1 --port 8080 -c 1024 -t 4 --threads-batch 4 \
            > llama-server.log 2>&1 &
          for i in $(seq 1 24); do
            if curl -s --max-time 5 http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              echo "SERVER-OK"; break
            fi
            sleep 5
          done
          curl -s --fail --max-time 5 http://127.0.0.1:8080/health
          CHAT_PORT=8765 python3 chat_proxy_llama.py > proxy.log 2>&1 &
          sleep 5
          curl -s --fail --max-time 5 http://127.0.0.1:8765/health
          echo "PROXY-OK"
          ssh -p 443 -R0:localhost:8765 -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o LogLevel=ERROR a.pinggy.io \
            > tunnel.log 2>&1 &
          sleep 25
          URL=$(grep -oE "https://[a-z0-9.-]*\.free\.pinggy\.net" tunnel.log | head -1)
          echo "========================================"
          echo "CHAT-LINK: $URL"
          echo "(link ke aage ?key=<tumhari key> lagana hai)"
          echo "========================================"
          # Keep the session alive until near the 6 h job cap.
          sleep 330m
